# Render Blueprint Specification for PairPort
# Schema: https://render.com/docs/blueprint-spec

services:
  # ----------------------------------------------------------------------------
  # Backend Web Service: FastAPI WebSockets Signaling Relay
  # ----------------------------------------------------------------------------
  - type: web
    name: pairport-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PAIRPORT_ENV
        value: production
      - key: PAIRPORT_TRUST_PROXY_HEADERS
        value: "true"
      - key: PAIRPORT_WS_REQUIRE_ORIGIN
        value: "true"
      - key: PAIRPORT_ALLOWED_ORIGINS
        # Set in Render Dashboard to your frontend Static Site URL
        # Example: https://pairport-frontend.onrender.com
        sync: false

  # ----------------------------------------------------------------------------
  # Frontend Static Site: Vite Single Page Web App
  # ----------------------------------------------------------------------------
  - type: web
    name: pairport-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        # Set in Render Dashboard to your deployed backend URL
        # Example: https://pairport-api.onrender.com
        sync: false
      - key: VITE_WS_BASE_URL
        # Set in Render Dashboard to your deployed backend WebSocket URL
        # Example: wss://pairport-api.onrender.com
        sync: false
